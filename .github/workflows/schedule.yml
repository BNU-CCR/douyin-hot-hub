name: scheduled update and sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.repository == 'izukuuuu/douyin-hot-hub'
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        if: github.repository == 'izukuuuu/douyin-hot-hub'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Update hot list
        if: github.repository == 'izukuuuu/douyin-hot-hub'
        run: python main.py

      - name: Commit updates
        if: github.repository == 'izukuuuu/douyin-hot-hub'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "auto update"
          git push origin main

      - name: Fast-forward from personal fork
        if: github.repository == 'BNU-CCR/douyin-hot-hub'
        run: |
          git remote add personal https://github.com/nateafish/douyin-hot-hub.git
          git fetch personal main
          if git merge-base --is-ancestor personal/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --ff-only personal/main
          git push origin main
