name: scheduled update and sync

# 纯镜像仓库：不再自写抓取器，直接从上游 lonnyzhang423/douyin-hot-hub
# 拉取数据。因为本仓库是 fork，schedule 在 fork 上不可靠，由
# nateafish/mirror-driver 每小时 dispatch 本 workflow 触发。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream lonnyzhang423
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/lonnyzhang423/douyin-hot-hub.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit -X theirs upstream/main
          git push origin main
